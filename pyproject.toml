[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-rag"
version = "0.2.0"
description = "Multimodal RAG for evidence-grounded discourse analysis on the TRACE anti-racist corpus"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
